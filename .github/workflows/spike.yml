name: spike

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  spike:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Load claude-sync
        run: sh ci/load-claude-sync.sh

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            설정 확인용 실행이다. 아래를 수행하고 결과를 `gh pr comment`로 이 PR에 코멘트 하나로 남겨라.
            1. 지금 사용할 수 있는 스킬 이름을 모두 나열한다.
            2. 답변 언어에 대해 따르고 있는 규칙 문장을 그대로 인용한다.
            3. `convention-reviewer` 서브에이전트를 불러 "자기 이름과 실행 중인 모델 이름만 답하라"고 시키고, 그 답을 그대로 싣는다.
            4. `logic-reviewer` 서브에이전트에도 3과 같은 지시를 하고 답을 싣는다.
          claude_args: |
            --allowedTools "Bash(gh pr comment:*),Task,Agent"
