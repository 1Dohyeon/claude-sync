name: claude-mention

on:
  workflow_call:
    inputs:
      claude_sync_ref:
        description: 러너에 실을 claude-sync의 브랜치나 태그
        type: string
        default: main
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  claude:
    if: >-
      contains(github.event.comment.body, '@claude') &&
      (github.event_name == 'pull_request_review_comment' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Load claude-sync
        env:
          CLAUDE_SYNC_REF: ${{ inputs.claude_sync_ref }}
        run: |
          git clone --depth 1 --branch "$CLAUDE_SYNC_REF" https://github.com/1Dohyeon/claude-sync.git "$RUNNER_TEMP/claude-sync"
          sh "$RUNNER_TEMP/claude-sync/ci/load-claude-sync.sh"
          mkdir -p "$RUNNER_TEMP/review"

      # claude_args는 셸 인자처럼 파싱되므로 작은따옴표를 '\''로 바꿔 한 인자로 넘긴다.
      # 공백을 빼고 #으로 시작하는 줄은 claude_args의 주석으로 지워지므로 프롬프트에 그런 줄을 쓰지 않는다.
      - name: Read CI prompt
        id: ci-prompt
        run: |
          {
            echo 'text<<CI_PROMPT_EOF'
            sed "s/'/'\\\\''/g" "$RUNNER_TEMP/claude-sync/ci/prompts/pr-review.md"
            echo 'CI_PROMPT_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --append-system-prompt '${{ steps.ci-prompt.outputs.text }}'
            --add-dir ${{ runner.temp }}/review
            --allowedTools "Skill,Task,Agent,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh issue view:*),Bash(git diff:*),Bash(git log:*),Bash(git status:*),Bash(git rev-parse:*),Bash(git merge-base:*),Bash(mkdir:*),Bash(wc:*)"
